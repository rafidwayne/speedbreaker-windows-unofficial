name: Game (SpeedBreaker.exe)

# Three cached stages, so a normal change rebuilds only the runtime (minutes):
#   toolchain  no secrets; rebuilt only when win-build/toolchain.sh, deps.sh, the cmake file or patches/ change
#   ppc        needs XEX_URL; the slow compile of the generated code; cached by what it depends on.
#              Cache is saved even if the job fails or times out, so the next run resumes.
#   runtime    every run: ccache-backed incremental build of the exe from the cached ppc/ + archive
# XEX_URL (secret) = private download URL of default.xex; XEX_AUTH (optional) = header such as
# "Authorization: Bearer ...". Only the first run of a new ppc cache key fetches the XEX.
on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths: ['runtime/**', 'config/**', 'patches/**', 'win-build/**', 'CMakeLists.txt', '.github/workflows/game.yml']
  workflow_call:
    secrets:
      XEX_URL:
        required: false
      XEX_AUTH:
        required: false

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare /home/claude (the helper scripts use fixed paths)
        run: |
          sudo mkdir -p /home/claude && sudo chown "$USER" /home/claude
          ln -sfn "$GITHUB_WORKSPACE" /home/claude/speedbreaker
      - id: tc
        uses: actions/cache@v4
        with:
          path: |
            /home/claude/deps
            tools/XenonRecomp
          key: sb-toolchain-${{ hashFiles('win-build/toolchain.sh', 'win-build/deps.sh', 'win-build/mingw-toolchain.cmake', 'patches/**') }}
      - if: steps.tc.outputs.cache-hit != 'true'
        run: win-build/toolchain.sh

  game:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      XEX_URL: ${{ secrets.XEX_URL }}
      XEX_AUTH: ${{ secrets.XEX_AUTH }}
      PPC_KEY: sb-ppc-${{ hashFiles('config/**', 'patches/xenonrecomp/**', 'win-build/build_ppc.sh', 'win-build/toolchain.sh', 'win-build/deps.sh', 'runtime/cpu/indirect.h', 'runtime/cpu/guest_time.h') }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare /home/claude and free disk
        run: |
          sudo mkdir -p /home/claude && sudo chown "$USER" /home/claude
          ln -sfn "$GITHUB_WORKSPACE" /home/claude/speedbreaker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ccache clang lld cmake ninja-build g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix || true
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix || true
          sudo ln -sf /usr/x86_64-w64-mingw32/include/windows.h /usr/x86_64-w64-mingw32/include/Windows.h
          cp win-build/mingw-toolchain.cmake win-build/deps.sh win-build/build_ppc.sh /home/claude/

      - name: Restore toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/claude/deps
            tools/XenonRecomp
          key: sb-toolchain-${{ hashFiles('win-build/toolchain.sh', 'win-build/deps.sh', 'win-build/mingw-toolchain.cmake', 'patches/**') }}
          fail-on-cache-miss: true

      - name: Restore finished ppc stage (generated code + archive)
        id: ppc
        uses: actions/cache/restore@v4
        with:
          path: |
            ppc
            /home/claude/libNfsmwRecompLib.a
          key: ${{ env.PPC_KEY }}

      - name: Is a default.xex source configured?
        id: cfg
        run: |
          if [ "${{ steps.ppc.outputs.cache-hit }}" = "true" ]; then echo "need=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$XEX_URL" ]; then echo "need=true" >> "$GITHUB_OUTPUT"
          else echo "::error::No cached ppc stage and the XEX_URL secret is not set."; exit 1; fi

      - name: Restore partial objects (resume after a timeout)
        if: steps.cfg.outputs.need == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /home/claude/ppcobj
          key: sb-ppcobj-${{ github.run_id }}
          restore-keys: sb-ppcobj-

      - name: Fetch default.xex
        if: steps.cfg.outputs.need == 'true'
        run: |
          # For a private release asset use the API URL (https://api.github.com/repos/OWNER/REPO/releases/assets/ID)
          # with XEX_AUTH="Authorization: Bearer <token>"; the Accept header below is what makes the API return the file.
          args=(-fsSL --retry 3 -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/default.xex")
          if [ -n "$XEX_AUTH" ]; then args+=(-H "$XEX_AUTH"); fi
          curl "${args[@]}" "$XEX_URL"

      - name: Compile generated code (slow; first run of a new key only)
        if: steps.cfg.outputs.need == 'true'
        timeout-minutes: 330   # step-level, so the cache-save steps below still run if this one times out
        run: win-build/ppc.sh "$RUNTIME_TEMP_XEX"
        env:
          RUNTIME_TEMP_XEX: ${{ runner.temp }}/default.xex

      - name: Save partial objects even if the step above failed or timed out
        if: always() && steps.cfg.outputs.need == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/claude/ppcobj
          key: sb-ppcobj-${{ github.run_id }}

      - name: Save finished ppc stage
        if: steps.cfg.outputs.need == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            ppc
            /home/claude/libNfsmwRecompLib.a
          key: ${{ env.PPC_KEY }}

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: sb-ccache-${{ github.sha }}
          restore-keys: sb-ccache-

      - name: Build the exe (fast path)
        run: |
          win-build/runtime.sh
          mkdir -p dist && cp /home/claude/SpeedBreaker.exe dist/
          (cd dist && sha256sum SpeedBreaker.exe > SpeedBreaker.exe.sha256)
          ccache -s | head -5 || true

      - name: Remove the xex
        if: always()
        run: rm -f "$RUNNER_TEMP/default.xex" game/files/default.xex

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedBreaker
          path: |
            dist/SpeedBreaker.exe
            dist/SpeedBreaker.exe.sha256
